<script>
  /* INSTALL: the game as an app -- an icon on the desktop or home screen, full screen, and
     playable against bots offline once it has loaded (manifest.webmanifest, sw.js). Chrome and
     Edge offer it, and Settings has the button (menu.js); on an iPhone or iPad it is Share,
     then Add to Home Screen. The offer can come before the game's scripts are in, so it is
     caught here.
     Only the live site installs. A copy served from this computer (the dev server) has no
     manifest and no offline copy: an app installed from it would only run while that server
     is open, and every edit has to show up there at once anyway. (?sw=1 turns both on there,
     for a test.) */
  window.AppInstall = {
    evt: null, changed: null,
    local: /^(localhost|127\.0\.0\.1|\[::1\])$|\.localhost$/.test(location.hostname) && !/[?&]sw=1/.test(location.search),
    installed: matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true,
    ios: /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)),
    prompt: async function () {
      var e = AppInstall.evt; if (!e) return false;
      e.prompt();
      try { var c = await e.userChoice; if (c && c.outcome === "accepted") AppInstall.evt = null; } catch (x) {}
      return true;
    },
  };
  if (!AppInstall.local) document.write('<link rel="manifest" href="manifest.webmanifest">');
  addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); AppInstall.evt = e; if (AppInstall.changed) AppInstall.changed(); });
  addEventListener("appinstalled", function () {
    AppInstall.installed = true; AppInstall.evt = null;
    if (window.UI && UI.toast) UI.toast("Installed: BLOCKADE now has its own icon.");
    if (AppInstall.changed) AppInstall.changed();
  });
  if ("serviceWorker" in navigator && !AppInstall.local) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
